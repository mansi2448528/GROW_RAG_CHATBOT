# MF FAQ Assistant — single source of truth for models, sizes, paths.
# Changing the embedding model or vector store here requires NO code edits,
# only a re-ingest: python -m app.pipeline --stage all --rebuild

app:
  name: "MF FAQ Assistant"
  artifacts_dir: "data/artifacts"
  log_level: "INFO"

corpus:
  manifest: "data/corpus/urls.csv"
  lexicon: "config/lexicon.yaml"
  cache_dir: "data/cache"
  min_chars_per_page: 1500
  min_chars_by_page_type:
    groww_scheme: 800        # compact fact sheet from __NEXT_DATA__, not full page text
    sebi_page: 300           # SEBI investor pages are short by design
    amfi_page: 500           # AMFI landing pages are navigation-light and terse
  request_timeout_s: 20
  retries: 1
  rate_limit_rps: 0.5
  user_agent: "mf-faq-research-bot/1.0 (+public pages only)"

embedding:
  model_id: "sentence-transformers/all-MiniLM-L6-v2"
  dim: 384
  normalize: true
  max_seq_length: 256
  batch_size: 32
  device: "cpu"
  preprocessing: "page_title+section_path+v1"

vectorstore:
  provider: "chroma"
  persist_dir: "data/chroma"
  collection_prefix: "mf_faq"
  distance: "cosine"

chunking:
  max_tokens: 256           # must be <= embedding.max_seq_length
  merge_target_tokens: [200, 400]
  overlap_ratio: 0.12       # prose only, never tables
  tokenizer_model: "sentence-transformers/all-MiniLM-L6-v2"
  quarantine_patterns:
    - "investments are subject to market risks"
    - "past performance is not indicative"
    - "mutual fund investments do not offer guaranteed"
    - "read all scheme related documents"

retrieval:
  top_k: 5
  keep: 3
  score_threshold: 0.35
  lexical_boost: 0.15       # rerank tie-break; threshold still applies to cosine
  filter_by_scheme: true
  exclude_quarantined: true
  rewrite: "template"       # template | llm

llm:
  provider: "groq"          # groq | openai | gemini | anthropic | mistral
  model_env: "LLM_MODEL"    # model id is read from .env, never hardcoded
  temperature: 0.1
  top_p: 0.9
  max_tokens: 400          # gpt-oss reasoning tokens count toward this budget
  timeout_s: 20
  max_retries: 1
  json_mode: true

guardrails:
  use_llm_judge: false      # rules-only until §8 tests pass
  max_sentences: 3
  advice_terms: ["should", "recommend", "buy", "sell", "hold", "best", "guaranteed", "worth it"]

artifacts:
  write_per_query: true
  qa_log: "data/artifacts/qa_log.csv"
